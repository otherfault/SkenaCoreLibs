name: Build All Prebuilt Libraries (Linux, Android, Windows, Wasm)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. BOX2D (LINUX, ANDROID, WINDOWS, WASM)
  # ============================================================================
  build-box2d-linux:
    name: Box2D - Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'erincatto/box2d'
          ref: 'main'
          fetch-depth: 1
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build \
            libwayland-dev wayland-protocols libxkbcommon-dev xorg-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir \
            -DBUILD_SHARED_LIBS=OFF -DBOX2D_SAMPLES=OFF -DBOX2D_UNIT_TESTS=OFF -DBOX2D_VALIDATION=OFF
          cmake --build build --config Release && cmake --install build
          tar -czvf box2d-linux-x64-prebuilt.tar.gz -C install_dir include lib
      - uses: actions/upload-artifact@v4
        with: { name: box2d-linux-x64, path: box2d-linux-x64-prebuilt.tar.gz, if-no-files-found: error }

  build-box2d-android:
    name: Box2D - Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'erincatto/box2d'
          ref: 'main'
          fetch-depth: 1
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
          cmake -S . -B build_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_android -DBUILD_SHARED_LIBS=OFF \
            -DBOX2D_SAMPLES=OFF -DBOX2D_UNIT_TESTS=OFF -DBOX2D_VALIDATION=OFF
          cmake --build build_android --config Release && cmake --install build_android
          (cd install_dir_android && zip -r ../box2d-android-arm64-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: box2d-android-arm64, path: box2d-android-arm64-prebuilt.zip, if-no-files-found: error }

  build-box2d-windows:
    name: Box2D - Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'erincatto/box2d'
          ref: 'main'
          fetch-depth: 1
      - run: |
          cmake -S . -B build_win -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir_win `
            -DBUILD_SHARED_LIBS=OFF -DBOX2D_SAMPLES=OFF -DBOX2D_UNIT_TESTS=OFF -DBOX2D_VALIDATION=OFF
          cmake --build build_win --config Release
          cmake --install build_win --config Release
          Compress-Archive -Path install_dir_win\include, install_dir_win\lib -DestinationPath box2d-windows-x64-prebuilt.zip
      - uses: actions/upload-artifact@v4
        with: { name: box2d-windows-x64, path: box2d-windows-x64-prebuilt.zip, if-no-files-found: error }

  build-box2d-wasm:
    name: Box2D - Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'erincatto/box2d'
          ref: 'main'
          fetch-depth: 1
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
          emcmake cmake -S . -B build_wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir_wasm \
            -DBUILD_SHARED_LIBS=OFF -DBOX2D_SAMPLES=OFF -DBOX2D_UNIT_TESTS=OFF -DBOX2D_VALIDATION=OFF
          cmake --build build_wasm --config Release && cmake --install build_wasm
          (cd install_dir_wasm && zip -r ../box2d-wasm-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: box2d-wasm, path: box2d-wasm-prebuilt.zip, if-no-files-found: error }

  # ============================================================================
  # 2. QUICKJS-NG (LINUX, ANDROID, WINDOWS, WASM)
  # ============================================================================
  build-quickjs-linux:
    name: QuickJS-NG - Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'quickjs-ng/quickjs', ref: 'master', fetch-depth: 1 }
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release && cmake --install build
          tar -czvf quickjs-linux-x64-prebuilt.tar.gz -C install_dir include lib
      - uses: actions/upload-artifact@v4
        with: { name: quickjs-linux-x64, path: quickjs-linux-x64-prebuilt.tar.gz, if-no-files-found: error }

  build-quickjs-android:
    name: QuickJS-NG - Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'quickjs-ng/quickjs', ref: 'master', fetch-depth: 1 }
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
          cmake -S . -B build_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_android -DBUILD_SHARED_LIBS=OFF
          cmake --build build_android --config Release && cmake --install build_android
          (cd install_dir_android && zip -r ../quickjs-android-arm64-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: quickjs-android-arm64, path: quickjs-android-arm64-prebuilt.zip, if-no-files-found: error }

  build-quickjs-windows:
    name: QuickJS-NG - Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'quickjs-ng/quickjs', ref: 'master', fetch-depth: 1 }
      - run: |
          cmake -S . -B build_win -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir_win -DBUILD_SHARED_LIBS=OFF
          cmake --build build_win --config Release
          cmake --install build_win --config Release
          Compress-Archive -Path install_dir_win\include, install_dir_win\lib -DestinationPath quickjs-windows-x64-prebuilt.zip
      - uses: actions/upload-artifact@v4
        with: { name: quickjs-windows-x64, path: quickjs-windows-x64-prebuilt.zip, if-no-files-found: error }

  build-quickjs-wasm:
    name: QuickJS-NG - Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'quickjs-ng/quickjs', ref: 'master', fetch-depth: 1 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
          emcmake cmake -S . -B build_wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir_wasm \
            -DBUILD_SHARED_LIBS=OFF -DQJS_BUILD_CLI=OFF
          cmake --build build_wasm --config Release && cmake --install build_wasm
          (cd install_dir_wasm && zip -r ../quickjs-wasm-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: quickjs-wasm, path: quickjs-wasm-prebuilt.zip, if-no-files-found: error }

  # ============================================================================
  # 3. SDL3 (LINUX, ANDROID, WINDOWS, WASM)
  # ============================================================================
  build-sdl3-linux:
    name: SDL3 - Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'libsdl-org/SDL', ref: 'main', fetch-depth: 1 }
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libxtst-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir -DSDL_SHARED=OFF -DSDL_STATIC=ON
          cmake --build build --config Release && cmake --install build
          tar -czvf sdl3-linux-x64-prebuilt.tar.gz -C install_dir include lib
      - uses: actions/upload-artifact@v4
        with: { name: sdl3-linux-x64, path: sdl3-linux-x64-prebuilt.tar.gz, if-no-files-found: error }

  build-sdl3-android:
    name: SDL3 - Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'libsdl-org/SDL', ref: 'main', fetch-depth: 1 }
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
          cmake -S . -B build_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_android -DSDL_SHARED=OFF -DSDL_STATIC=ON
          cmake --build build_android --config Release && cmake --install build_android
          (cd install_dir_android && zip -r ../sdl3-android-arm64-prebuilt.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: sdl3-android-arm64, path: sdl3-android-arm64-prebuilt.zip, if-no-files-found: error }

  build-sdl3-windows:
    name: SDL3 - Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'libsdl-org/SDL', ref: 'main', fetch-depth: 1 }
      - run: |
          cmake -S . -B build_win -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir_win -DSDL_SHARED=OFF -DSDL_STATIC=ON
          cmake --build build_win --config Release
          cmake --install build_win --config Release
          Compress-Archive -Path install_dir_win\include, install_dir_win\lib -DestinationPath sdl3-windows-x64-prebuilt.zip
      - uses: actions/upload-artifact@v4
        with: { name: sdl3-windows-x64, path: sdl3-windows-x64-prebuilt.zip, if-no-files-found: error }

  build-sdl3-wasm:
    name: SDL3 - Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'libsdl-org/SDL', ref: 'main', fetch-depth: 1 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
          emcmake cmake -S . -B build_wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir_wasm -DSDL_SHARED=OFF -DSDL_STATIC=ON
          cmake --build build_wasm --config Release && cmake --install build_wasm
          (cd install_dir_wasm && zip -r ../sdl3-wasm-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: sdl3-wasm, path: sdl3-wasm-prebuilt.zip, if-no-files-found: error }

  # ============================================================================
  # 4. SKIA CHROME 158 (LINUX, ANDROID, WINDOWS, WASM)
  # ============================================================================
  build-skia-linux:
    name: Skia - Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: google/skia, ref: chrome/m150, fetch-depth: 1, path: skia }
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang libfontconfig-dev libgl1-mesa-dev libvulkan-dev git python3-venv ninja-build zip unzip
      - working-directory: skia
        run: |
          set -e
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do python tools/git-sync-deps && break || sleep 10; done
          bin/fetch-gn
          bin/gn gen out/Linux_x64 --args='target_os="linux" target_cpu="x64" is_debug=false is_official_build=true skia_enable_ganesh=true skia_use_gl=true skia_use_vulkan=true skia_use_freetype=true skia_use_harfbuzz=true skia_use_icu=true skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false'
          ninja -C out/Linux_x64
          mkdir -p release_assets/lib && cp -r include release_assets/
          [ -d modules ] && find modules -type f \( -name "*.h" -o -name "*.hpp" \) -exec cp --parents {} release_assets/ \;
          [ -d third_party ] && find third_party -type f \( -name "*.h" -o -name "*.hpp" \) -exec cp --parents {} release_assets/ \;
          find out/Linux_x64 -type f \( -name "*.a" -o -name "*.so" \) -exec cp {} release_assets/lib/ \;
          tar -czvf skia-linux-x64-prebuilt.tar.gz -C release_assets .
      - uses: actions/upload-artifact@v4
        with: { name: skia-linux-x64, path: skia/skia-linux-x64-prebuilt.tar.gz, if-no-files-found: error }

  build-skia-android:
    name: Skia - Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: google/skia, ref: chrome/m150, fetch-depth: 1, path: skia }
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang lld libfontconfig-dev git python3-venv ninja-build zip unzip
      - working-directory: skia
        run: |
          set -e
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do python tools/git-sync-deps && break || sleep 10; done
          bin/fetch-gn
          bin/gn gen out/Android_arm64 --args='ndk="'$ANDROID_NDK_LATEST_HOME'" target_os="android" target_cpu="arm64" is_debug=false is_official_build=true skia_enable_ganesh=true skia_use_gl=true skia_use_vulkan=true skia_use_freetype=true skia_use_harfbuzz=true skia_use_icu=true skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false'
          ninja -C out/Android_arm64
          mkdir -p release_assets/lib && cp -r include release_assets/
          [ -d modules ] && find modules -type f \( -name "*.h" -o -name "*.hpp" \) -exec cp --parents {} release_assets/ \;
          [ -d third_party ] && find third_party -type f \( -name "*.h" -o -name "*.hpp" \) -exec cp --parents {} release_assets/ \;
          find out/Android_arm64 -type f \( -name "*.a" -o -name "*.so" \) -exec cp {} release_assets/lib/ \;
          (cd release_assets && zip -r ../skia-android-arm64-prebuilt.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: skia-android-arm64, path: skia/skia-android-arm64-prebuilt.zip, if-no-files-found: error }

  build-skia-windows:
    name: Skia - Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: google/skia, ref: chrome/m150, fetch-depth: 1, path: skia }
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - working-directory: skia
        shell: bash
        run: |
          set -e
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do python tools/git-sync-deps && break || sleep 10; done
          python tools/fetch_gn.py || bin/fetch-gn
          pip install ninja
          bin/gn gen out/Windows_x64 --args='target_os="win" target_cpu="x64" is_debug=false is_official_build=true skia_enable_ganesh=true skia_use_gl=true skia_use_vulkan=true skia_use_freetype=true skia_use_harfbuzz=true skia_use_icu=true skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false'
          ninja -C out/Windows_x64
          mkdir -p release_assets/lib && cp -r include release_assets/
          [ -d modules ] && find modules -type f \( -name "*.h" -o -name "*.hpp" \) -exec cp --parents {} release_assets/ \;
          [ -d third_party ] && find third_party -type f \( -name "*.h" -o -name "*.hpp" \) -exec cp --parents {} release_assets/ \;
          find out/Windows_x64 -type f \( -name "*.lib" -o -name "*.dll" \) -exec cp {} release_assets/lib/ \;
          powershell -Command "Compress-Archive -Path release_assets\* -DestinationPath skia-windows-x64-prebuilt.zip"
      - uses: actions/upload-artifact@v4
        with: { name: skia-windows-x64, path: skia/skia-windows-x64-prebuilt.zip, if-no-files-found: error }

  build-skia-wasm:
    name: Skia - Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: google/skia, ref: chrome/m150, fetch-depth: 1, path: skia }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang libfontconfig-dev git python3-venv ninja-build zip unzip
      - working-directory: skia
        run: |
          set -e
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do python tools/git-sync-deps && break || sleep 10; done
          bin/fetch-gn
          bin/gn gen out/Wasm --args='target_os="wasm" target_cpu="wasm" cc="emcc" cxx="em++" ar="emar" is_debug=false is_official_build=true skia_enable_ganesh=true skia_use_gl=true skia_use_webgl=true skia_use_vulkan=false skia_use_freetype=true skia_use_harfbuzz=true skia_use_icu=true skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false'
          ninja -C out/Wasm
          mkdir -p release_assets/lib && cp -r include release_assets/
          [ -d modules ] && find modules -type f \( -name "*.h" -o -name "*.hpp" \) -exec cp --parents {} release_assets/ \;
          [ -d third_party ] && find third_party -type f \( -name "*.h" -o -name "*.hpp" \) -exec cp --parents {} release_assets/ \;
          find out/Wasm -type f -name "*.a" -exec cp {} release_assets/lib/ \;
          (cd release_assets && zip -r ../skia-wasm-prebuilt.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: skia-wasm, path: skia/skia-wasm-prebuilt.zip, if-no-files-found: error }
    
  # ============================================================================
  # 5. SQLITE3 (LINUX, ANDROID, WINDOWS, WASM)
  # ============================================================================
  build-sqlite3-linux:
    name: SQLite3 - Linux x64
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential curl unzip
          curl -sL https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip -o sqlite.zip
          unzip sqlite.zip && mv sqlite-amalgamation-* sqlite
          mkdir -p install_dir/include install_dir/lib
          cp sqlite/*.h install_dir/include/
          gcc -O3 -fPIC -DSQLITE_THREADSAFE=1 -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE -c sqlite/sqlite3.c -o sqlite3.o
          ar rcs install_dir/lib/libsqlite3.a sqlite3.o
          tar -czvf sqlite3-linux-x64-prebuilt.tar.gz -C install_dir include lib
      - uses: actions/upload-artifact@v4
        with: { name: sqlite3-linux-x64, path: sqlite3-linux-x64-prebuilt.tar.gz, if-no-files-found: error }

  build-sqlite3-android:
    name: SQLite3 - Android ARM64
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update && sudo apt-get install -y curl unzip zip
          curl -sL https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip -o sqlite.zip
          unzip sqlite.zip && mv sqlite-amalgamation-* sqlite
          mkdir -p install_dir/include install_dir/lib
          cp sqlite/*.h install_dir/include/
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/aarch64-linux-android21-clang" -O3 -fPIC -DSQLITE_THREADSAFE=1 -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE -c sqlite/sqlite3.c -o sqlite3.o
          "$TOOLCHAIN/llvm-ar" rcs install_dir/lib/libsqlite3.a sqlite3.o
          (cd install_dir && zip -r ../sqlite3-android-arm64-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: sqlite3-android-arm64, path: sqlite3-android-arm64-prebuilt.zip, if-no-files-found: error }

  build-sqlite3-windows:
    name: SQLite3 - Windows x64
    runs-on: windows-latest
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
      - run: |
          Invoke-WebRequest -Uri "https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip" -OutFile "sqlite.zip"
          Expand-Archive -Path "sqlite.zip" -DestinationPath "."
          Move-Item sqlite-amalgamation-* sqlite
          New-Item -ItemType Directory -Force -Path install_dir\include, install_dir\lib
          Copy-Item sqlite\*.h install_dir\include\
          cl /O2 /MT /DSQLITE_THREADSAFE=1 /DSQLITE_ENABLE_FTS5 /DSQLITE_ENABLE_JSON1 /DSQLITE_ENABLE_RTREE /c sqlite\sqlite3.c /Fosqlite3.obj
          lib /OUT:install_dir\lib\sqlite3.lib sqlite3.obj
          Compress-Archive -Path install_dir\include, install_dir\lib -DestinationPath sqlite3-windows-x64-prebuilt.zip
      - uses: actions/upload-artifact@v4
        with: { name: sqlite3-windows-x64, path: sqlite3-windows-x64-prebuilt.zip, if-no-files-found: error }

  build-sqlite3-wasm:
    name: SQLite3 - Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - run: |
          sudo apt-get update && sudo apt-get install -y curl unzip zip
          curl -sL https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip -o sqlite.zip
          unzip sqlite.zip && mv sqlite-amalgamation-* sqlite
          mkdir -p install_dir/include install_dir/lib
          cp sqlite/*.h install_dir/include/
          emcc -O3 -DSQLITE_THREADSAFE=0 -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE -c sqlite/sqlite3.c -o sqlite3.o
          emar rcs install_dir/lib/libsqlite3.a sqlite3.o
          (cd install_dir && zip -r ../sqlite3-wasm-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: sqlite3-wasm, path: sqlite3-wasm-prebuilt.zip, if-no-files-found: error }

  # ============================================================================
  # 6. LIBCURL (LINUX, ANDROID, WINDOWS, WASM)
  # ============================================================================
  build-libcurl-linux:
    name: libcurl - Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'curl/curl', ref: 'master', fetch-depth: 1 }
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libssl-dev zlib1g-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_CURL_EXE=OFF -DCURL_USE_OPENSSL=ON -DHTTP_ONLY=ON -DCURL_USE_LIBPSL=OFF
          cmake --build build --config Release && cmake --install build
          tar -czvf libcurl-linux-x64-prebuilt.tar.gz -C install_dir include lib
      - uses: actions/upload-artifact@v4
        with: { name: libcurl-linux-x64, path: libcurl-linux-x64-prebuilt.tar.gz, if-no-files-found: error }

  build-libcurl-android:
    name: libcurl - Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'curl/curl', ref: 'master', fetch-depth: 1 }
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
          # Menggunakan mbedTLS / wolfSSL atau build tanpa SSL eksternal; di sini build mbedTLS statis terlebih dahulu
          git clone --depth 1 --branch v3.6.2 https://github.com/Mbed-TLS/mbedtls.git mbedtls
          cmake -S mbedtls -B mbedtls_build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/mbedtls_install" -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF
          cmake --build mbedtls_build && cmake --install mbedtls_build
          cmake -S . -B build_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_android -DBUILD_SHARED_LIBS=OFF -DBUILD_CURL_EXE=OFF \
            -DCURL_USE_MBEDTLS=ON -DMBEDTLS_INCLUDE_DIRS="$PWD/mbedtls_install/include" \
            -DMBEDTLS_LIBRARY="$PWD/mbedtls_install/lib/libmbedtls.a" \
            -DMBEDX509_LIBRARY="$PWD/mbedtls_install/lib/libmbedx509.a" \
            -DMBEDCRYPTO_LIBRARY="$PWD/mbedtls_install/lib/libmbedcrypto.a" \
            -DCURL_ZLIB=ON -DHTTP_ONLY=ON -DCURL_USE_LIBPSL=OFF
          cmake --build build_android && cmake --install build_android
          cp mbedtls_install/lib/*.a install_dir_android/lib/
          (cd install_dir_android && zip -r ../libcurl-android-arm64-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: libcurl-android-arm64, path: libcurl-android-arm64-prebuilt.zip, if-no-files-found: error }

  build-libcurl-windows:
    name: libcurl - Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'curl/curl', ref: 'master', fetch-depth: 1 }
      - run: |
          cmake -S . -B build_win -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir_win `
            -DBUILD_SHARED_LIBS=OFF -DBUILD_CURL_EXE=OFF -DCURL_USE_SCHANNEL=ON -DHTTP_ONLY=ON -DCURL_USE_LIBPSL=OFF
          cmake --build build_win --config Release
          cmake --install build_win --config Release
          Compress-Archive -Path install_dir_win\include, install_dir_win\lib -DestinationPath libcurl-windows-x64-prebuilt.zip
      - uses: actions/upload-artifact@v4
        with: { name: libcurl-windows-x64, path: libcurl-windows-x64-prebuilt.zip, if-no-files-found: error }

  build-libcurl-wasm:
    name: libcurl - Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'curl/curl', ref: 'master', fetch-depth: 1 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build zip
          emcmake cmake -S . -B build_wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install_dir_wasm \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_CURL_EXE=OFF -DCURL_DISABLE_SSL=ON -DHTTP_ONLY=ON -DCURL_USE_LIBPSL=OFF \
            -DHAVE_ALARM=0 -DHAVE_SIGNAL=0
          cmake --build build_wasm --config Release && cmake --install build_wasm
          (cd install_dir_wasm && zip -r ../libcurl-wasm-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: libcurl-wasm, path: libcurl-wasm-prebuilt.zip, if-no-files-found: error }

  # ============================================================================
  # 7. FFMPEG (LINUX, ANDROID, WINDOWS, WASM)
  # ============================================================================
  build-ffmpeg-linux:
    name: FFmpeg - Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'FFmpeg/FFmpeg', ref: 'master', fetch-depth: 1 }
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential nasm yasm pkg-config
          ./configure --prefix="$PWD/install_dir" --enable-static --disable-shared \
            --disable-programs --disable-doc --enable-pic
          make -j$(nproc) && make install
          tar -czvf ffmpeg-linux-x64-prebuilt.tar.gz -C install_dir include lib
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg-linux-x64, path: ffmpeg-linux-x64-prebuilt.tar.gz, if-no-files-found: error }

  build-ffmpeg-android:
    name: FFmpeg - Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'FFmpeg/FFmpeg', ref: 'master', fetch-depth: 1 }
      - run: |
          sudo apt-get update && sudo apt-get install -y nasm yasm make zip
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          ./configure --prefix="$PWD/install_dir" --enable-cross-compile \
            --target-os=android --arch=aarch64 --cpu=armv8-a \
            --cc="$TOOLCHAIN/bin/aarch64-linux-android21-clang" \
            --cxx="$TOOLCHAIN/bin/aarch64-linux-android21-clang++" \
            --ar="$TOOLCHAIN/bin/llvm-ar" --nm="$TOOLCHAIN/bin/llvm-nm" \
            --ranlib="$TOOLCHAIN/bin/llvm-ranlib" --strip="$TOOLCHAIN/bin/llvm-strip" \
            --sysroot="$TOOLCHAIN/sysroot" --enable-static --disable-shared \
            --disable-programs --disable-doc --enable-pic
          make -j$(nproc) && make install
          (cd install_dir && zip -r ../ffmpeg-android-arm64-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg-android-arm64, path: ffmpeg-android-arm64-prebuilt.zip, if-no-files-found: error }

  build-ffmpeg-windows:
    name: FFmpeg - Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'FFmpeg/FFmpeg', ref: 'master', fetch-depth: 1 }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make diffutils nasm yasm pkg-config
      - shell: msys2 {0}
        run: |
          ./configure --prefix="$PWD/install_dir" --toolchain=msvc --arch=x86_64 --target-os=win64 \
            --enable-static --disable-shared --disable-programs --disable-doc
          make -j$(nproc) && make install
          # Konversi libav*.a dari MSVC toolchain menjadi libav*.lib
          for f in install_dir/lib/lib*.a; do
            base=$(basename "$f" .a)
            mv "$f" "install_dir/lib/${base#lib}.lib"
          done
      - run: Compress-Archive -Path install_dir\include, install_dir\lib -DestinationPath ffmpeg-windows-x64-prebuilt.zip
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg-windows-x64, path: ffmpeg-windows-x64-prebuilt.zip, if-no-files-found: error }

  build-ffmpeg-wasm:
    name: FFmpeg - Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: 'FFmpeg/FFmpeg', ref: 'master', fetch-depth: 1 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - run: |
          sudo apt-get update && sudo apt-get install -y make zip
          emconfigure ./configure --prefix="$PWD/install_dir" --enable-cross-compile \
            --target-os=none --arch=x86_32 --cpu=generic \
            --cc=emcc --cxx=em++ --ar=emar --ranlib=emranlib \
            --disable-x86asm --disable-inline-asm --disable-stripping \
            --disable-programs --disable-doc --disable-pthreads \
            --enable-static --disable-shared
          emmake make -j$(nproc) && emmake make install
          (cd install_dir && zip -r ../ffmpeg-wasm-prebuilt.zip include lib)
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg-wasm, path: ffmpeg-wasm-prebuilt.zip, if-no-files-found: error }

  # ============================================================================
  # 8. PUBLISH UNIFIED GITHUB RELEASE (28 ARTIFACTS)
  # ============================================================================
  publish-release:
    name: Publish All Prebuilt Libraries
    runs-on: ubuntu-latest
    needs:
      - build-box2d-linux
      - build-box2d-android
      - build-box2d-windows
      - build-box2d-wasm
      - build-quickjs-linux
      - build-quickjs-android
      - build-quickjs-windows
      - build-quickjs-wasm
      - build-sdl3-linux
      - build-sdl3-android
      - build-sdl3-windows
      - build-sdl3-wasm
      - build-skia-linux
      - build-skia-android
      - build-skia-windows
      - build-skia-wasm
      - build-sqlite3-linux
      - build-sqlite3-android
      - build-sqlite3-windows
      - build-sqlite3-wasm
      - build-libcurl-linux
      - build-libcurl-android
      - build-libcurl-windows
      - build-libcurl-wasm
      - build-ffmpeg-linux
      - build-ffmpeg-android
      - build-ffmpeg-windows
      - build-ffmpeg-wasm
    if: github.event_name != 'pull_request'

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify Downloaded Files
        run: ls -lh release_assets

      - name: Update Continuous Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Prebuilt Libraries"
          body: |
            Automated continuous build of prebuilt libraries (Linux x64, Android ARM64, Windows x64, Wasm):
            - **Box2D**
            - **QuickJS-NG**
            - **SDL3**
            - **Skia Chrome 158 / m150**
            - **SQLite3** (FTS5, JSON1, RTree enabled)
            - **libcurl** (HTTP/HTTPS static)
            - **FFmpeg** (Static libraries: avcodec, avformat, avutil, swscale, swresample)
          artifacts: "release_assets/*"
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
